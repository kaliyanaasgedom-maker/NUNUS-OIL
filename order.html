<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order NUNU'S Hair Oil</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="contact">

<h1>Order NUNU'S Hair Oil 🌿</h1>

<h2>Price: 550 ETB</h2>

<p>
💳 Payment Before Delivery<br><br>

CBE: 1000580014128<br>
Telebirr: 0911626334
</p>

<p>
🚚 Delivery:<br>
Piazza & Megenagna: Free delivery<br>
Other areas: Delivery fee applies
</p>


<h3>Your Information</h3>

<input id="name" type="text" placeholder="Your Name">
<br><br>

<input id="phone" type="text" placeholder="Your Phone Number">
<br><br>

<input id="address" type="text" placeholder="Delivery Address">
<br><br>

<input id="quantity" type="number" value="1" min="1">
<br><br>

<button onclick="sendOrder()">Place Order 🌿</button>


</section>


<script>

function sendOrder(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;
let quantity = document.getElementById("quantity").value;

let total = quantity * 550;

let message =
"NUNU'S Hair Oil Order 🌿%0A%0A" +
"Name: " + name + "%0A" +
"Phone: " + phone + "%0A" +
"Address: " + address + "%0A" +
"Quantity: " + quantity + "%0A" +
"Total: " + total + " ETB";

window.open("https://wa.me/251911626334?text=" + message);

}

</script>

</body>

</html>
